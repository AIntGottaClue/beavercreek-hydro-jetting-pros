name: Publish preview-only fixes
on:
  push:
    branches: [preview-fixes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-fixes-pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/preview-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-fixes
          fetch-depth: 0
      - name: Apply audited preview source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preview-fixes.patch <<'PATCH'
          diff --git a/src/components/Hero.astro b/src/components/Hero.astro
          index d899b19..211c547 100644
          --- a/src/components/Hero.astro
          +++ b/src/components/Hero.astro
          @@ -19,7 +19,6 @@ const noImg = ['Privacy', 'Terms'].includes(location);
                 <h1>{headline}</h1>
                 <p class="hero-copy">{intro}</p>
                 {!noImg && <img class="hero-img" src={u(img.src)} alt={img.alt} width="1200" height="675" loading="eager" decoding="async" fetchpriority="high" />}
          -      {!noImg && <p class="image-note">Illustrative image, not a photo of a local job.</p>}
               </div>
               <RequestForm location={location} />
             </div>
          PATCH
          if git apply --check /tmp/preview-fixes.patch; then
            git apply /tmp/preview-fixes.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src
            git commit -m 'Remove preview image disclaimers and update service cards'
            git push origin HEAD:preview-fixes
          elif git apply --reverse --check /tmp/preview-fixes.patch; then
            echo 'Preview source patch already applied.'
          else
            echo 'Preview patch no longer matches source. Review required.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /beavercreek-hydro-jetting-pros
          SITE_BASE: /beavercreek-hydro-jetting-pros
      - name: Publish only GitHub Pages preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
